<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATHAR Smart Notebook</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Caveat:wght@700&family=Teko:wght@500;600;700&family=Rozha+One&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        .custom-box-wrapper { position: relative; }
        .box-style-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: inherit;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            cursor: pointer;
            opacity: 0.7;
            transition: all 0.2s;
            z-index: 10;
        }
        .box-style-btn:hover { opacity: 1; transform: scale(1.1); }
    </style>
</head>
<body id="appBody" class="bg-gradient-to-br from-slate-900 via-indigo-950 to-purple-950 min-h-screen p-2 sm:p-4 text-gray-800">
    <div id="appContainer" class="max-w-md mx-auto space-y-3.5">
        
        <!-- HEADER -->
        <div id="headerBrandingCard" class="bg-white/95 backdrop-blur-xl border border-white/20 rounded-3xl p-4 shadow-xl custom-box-wrapper">
            <button onclick="openBoxStyleModal('headerBrandingCard')" class="box-style-btn" title="Edit Style"><i class="fa-solid fa-palette"></i></button>
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 bg-gradient-to-tr from-amber-500 to-orange-600 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-amber-500/30">
                    <i class="fa-solid fa-book-open text-lg"></i>
                </div>
                <div>
                    <h1 id="editableAppTitle" contenteditable="true" onblur="saveCustomAppTitle()" class="text-base font-extrabold text-gray-900 tracking-tight outline-none">ATHAR</h1>
                    <div class="flex items-center gap-2 text-[11px] text-gray-500 font-medium">
                        <span id="liveClockDisplay">--:--:--</span>
                        <span>•</span>
                        <span id="liveDateDisplay">-- -- ----</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- NEW ENTRY CARD -->
        <div id="newEntryCard" class="bg-white/95 backdrop-blur-xl border border-gray-200/80 rounded-3xl p-4 shadow-xl custom-box-wrapper">
            <button onclick="openBoxStyleModal('newEntryCard')" class="box-style-btn" title="Edit Style"><i class="fa-solid fa-palette"></i></button>
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-2">
                    <span class="w-8 h-8 bg-indigo-100 text-indigo-600 rounded-xl flex items-center justify-center text-sm"><i class="fa-solid fa-pen-nib"></i></span>
                    <h3 class="text-sm font-bold text-gray-800">Nayi Pravisti (New Entry)</h3>
                </div>
            </div>
            
            <div class="flex items-center bg-gray-100 p-1 rounded-xl text-xs font-semibold mb-3">
                <button onclick="setEntryType('income')" id="btnTypeIncome" class="flex-1 py-1.5 rounded-lg bg-emerald-600 text-white shadow-sm transition">Kamai (+)</button>
                <button onclick="setEntryType('expense')" id="btnTypeExpense" class="flex-1 py-1.5 rounded-lg text-gray-600 transition">Kharcha (-)</button>
            </div>

            <!-- Photo Upload -->
            <div class="grid grid-cols-2 gap-2 mb-3">
                <label class="flex items-center justify-center gap-2 py-2.5 px-3 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-xl text-xs font-semibold cursor-pointer border border-indigo-200 transition">
                    <i class="fa-solid fa-camera"></i>
                    <span>Camera</span>
                    <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="handleImageUpload(event)" class="hidden">
                </label>
                <label class="flex items-center justify-center gap-2 py-2.5 px-3 bg-purple-50 hover:bg-purple-100 text-purple-700 rounded-xl text-xs font-semibold cursor-pointer border border-purple-200 transition">
                    <i class="fa-solid fa-image"></i>
                    <span>Gallery</span>
                    <input type="file" id="galleryInput" accept="image/*" onchange="handleImageUpload(event)" class="hidden">
                </label>
            </div>

            <!-- Thumbnail Preview -->
            <div id="imagePreviewContainer" class="hidden relative mb-3 inline-block">
                <img id="uploadedImagePreview" class="w-20 h-20 object-cover rounded-2xl border-2 border-indigo-500 shadow-md">
                <button onclick="removeUploadedImage()" class="absolute -top-2 -right-2 w-6 h-6 bg-rose-600 text-white rounded-full flex items-center justify-center text-xs shadow-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <!-- Note Input -->
            <div class="mb-3">
                <label class="block text-[11px] font-bold text-gray-500 mb-1">Vivaran Likhein (Uda. 20 diva ya 15 lais):</label>
                <textarea id="noteInput" oninput="calculateLiveTotal()" rows="2" placeholder="Yahan saman ya sankhya likhein..." class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl text-xs font-medium text-gray-800 focus:outline-none focus:border-indigo-500 transition resize-none"></textarea>
            </div>

            <!-- Live Calculation Banner -->
            <div class="flex items-center justify-between bg-indigo-50/70 border border-indigo-100 px-3.5 py-2.5 rounded-xl mb-3">
                <span class="text-[11px] font-bold text-indigo-900">Live Calculation:</span>
                <span id="liveCalcResultText" class="text-xs font-extrabold text-indigo-700">₹0</span>
            </div>

            <button onclick="saveNewEntry()" class="w-full py-3 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-2xl text-xs font-bold shadow-lg shadow-indigo-500/30 flex items-center justify-center gap-2 transition hover:opacity-95">
                <i class="fa-solid fa-plus-circle text-sm"></i>
                <span>Entry Save Karein</span>
            </button>
        </div>
                <!-- HISTORY FEED -->
        <div id="historyFeedCard" class="bg-white/95 backdrop-blur-xl border border-gray-200/80 rounded-3xl p-4 shadow-xl custom-box-wrapper">
            <button onclick="openBoxStyleModal('historyFeedCard')" class="box-style-btn" title="Edit Style"><i class="fa-solid fa-palette"></i></button>
            <div class="flex items-center justify-between pb-2 border-b border-gray-100 mb-3">
                <div class="flex items-center gap-2">
                    <span class="w-8 h-8 bg-purple-100 text-purple-600 rounded-xl flex items-center justify-center text-sm"><i class="fa-solid fa-clock-rotate-left"></i></span>
                    <h3 class="text-sm font-bold text-gray-800">Purani Pravisti (History Feed)</h3>
                </div>
            </div>
            
            <!-- Filter Tabs -->
            <div class="flex items-center bg-gray-100 p-1 rounded-xl text-xs font-semibold text-center mb-3">
                <button onclick="setHistoryFilter('all')" id="filterTabAll" class="flex-1 py-1.5 rounded-lg bg-indigo-600 text-white shadow-sm transition">Sabhi</button>
                <button onclick="setHistoryFilter('income')" id="filterTabIncome" class="flex-1 py-1.5 rounded-lg text-gray-600 transition">Kamai</button>
                <button onclick="setHistoryFilter('expense')" id="filterTabExpense" class="flex-1 py-1.5 rounded-lg text-gray-600 transition">Kharcha</button>
            </div>

            <div id="savedEntriesList" class="space-y-2.5 max-h-96 overflow-y-auto pr-1"></div>
        </div>

    </div>

    <!-- PHOTO ZOOM / LIGHTBOX MODAL -->
    <div id="photoZoomModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4" onclick="closePhotoZoom()">
        <div class="relative max-w-2xl max-h-[90vh]" onclick="event.stopPropagation()">
            <button onclick="closePhotoZoom()" class="absolute -top-10 right-0 text-white hover:text-gray-300 text-2xl font-bold p-2"><i class="fa-solid fa-xmark"></i></button>
            <img id="zoomedImagePreview" src="" class="max-w-full max-h-[85vh] object-contain rounded-2xl shadow-2xl border-2 border-white/20">
        </div>
    </div>
    <script>
    let savedEntries = [];
    let currentEntryType = 'income';
    let currentHistoryFilter = 'all';
    let uploadedPhotoBase64 = null;
    
    // 15 Custom Rates
    let customRates = JSON.parse(localStorage.getItem('athar_custom_rates')) || [
        { name: "diva", rate: 50 },
        { name: "lais", rate: 30 },
        { name: "kurti", rate: 100 },
        { name: "gown", rate: 250 },
        { name: "shirt", rate: 120 },
        { name: "jacket", rate: 300 },
        { name: "palazzo", rate: 90 },
        { name: "anarkali", rate: 350 },
        { name: "blouse", rate: 80 },
        { name: "top", rate: 70 },
        { name: "jeans", rate: 150 },
        { name: "suit", rate: 400 },
        { name: "dupatta", rate: 40 },
        { name: "salwar", rate: 110 },
        { name: "coat", rate: 500 }
    ];

    function handleImageUpload(event) {
        let file = event.target.files[0];
        if(file) {
            let reader = new FileReader();
            reader.onload = function(e) {
                uploadedPhotoBase64 = e.target.result;
                let previewImg = document.getElementById('uploadedImagePreview');
                let previewContainer = document.getElementById('imagePreviewContainer');
                previewImg.src = uploadedPhotoBase64;
                previewContainer.classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }
    }

    function removeUploadedImage() {
        uploadedPhotoBase64 = null;
        document.getElementById('imagePreviewContainer').classList.add('hidden');
        document.getElementById('cameraInput').value = '';
        document.getElementById('galleryInput').value = '';
    }

    function calculateLiveTotal() {
        let text = document.getElementById('noteInput').value.trim();
        let resultEl = document.getElementById('liveCalcResultText');
        if(!text) {
            resultEl.innerText = "₹0";
            return 0;
        }
        let total = 0;
        let calcBreakdowns = [];
        let lines = text.split('\n');

        lines.forEach(line => {
            let lowerLine = line.toLowerCase();
            let matched = false;
            customRates.forEach(r => {
                if(lowerLine.includes(r.name)) {
                    let nums = line.replace(/[^0-9.]/g, '');
                    let qty = parseInt(nums) || 1;
                    let lineAmt = qty * r.rate;
                    total += lineAmt;
                    calcBreakdowns.push(`${qty}×₹${r.rate}=₹${lineAmt}`);
                    matched = true;
                }
            });
            if(!matched) {
                let pureNum = parseFloat(line.replace(/[^0-9.]/g, '')) || 0;
                if(pureNum > 0) {
                    total += pureNum;
                    calcBreakdowns.push(`₹${pureNum}`);
                }
            }
        });

        let prefix = currentEntryType === 'expense' ? 'Kharcha (-)' : 'Kamai (+)';
        resultEl.innerText = `${prefix}: ₹${total} (${calcBreakdowns.join(', ')})`;
        return total;
    }

    function setEntryType(type) {
        currentEntryType = type;
        let btnInc = document.getElementById('btnTypeIncome');
        let btnExp = document.getElementById('btnTypeExpense');
        if(type === 'income') {
            btnInc.className = "flex-1 py-1.5 rounded-lg bg-emerald-600 text-white shadow-sm transition";
            btnExp.className = "flex-1 py-1.5 rounded-lg text-gray-600 transition";
        } else {
            btnExp.className = "flex-1 py-1.5 rounded-lg bg-rose-600 text-white shadow-sm transition";
            btnInc.className = "flex-1 py-1.5 rounded-lg text-gray-600 transition";
        }
        calculateLiveTotal();
    }

    function setHistoryFilter(filter) {
        currentHistoryFilter = filter;
        ['all', 'income', 'expense'].forEach(f => {
            let btn = document.getElementById(`filterTab${f.charAt(0).toUpperCase() + f.slice(1)}`);
            if(btn) btn.className = f === filter ? "flex-1 py-1.5 rounded-lg bg-indigo-600 text-white shadow-sm transition" : "flex-1 py-1.5 rounded-lg text-gray-600 transition";
        });
        renderHistoryFeed();
    }

    function saveNewEntry() {
        let note = document.getElementById('noteInput').value.trim();
        let amount = calculateLiveTotal();
        if(amount <= 0 && !note) {
            alert("Kripya kuch vivaran ya rashi darj karein!");
            return;
        }
        let now = new Date();
        let newEntry = {
            id: Date.now(),
            type: currentEntryType,
            note: note,
            amount: amount,
            photo: uploadedPhotoBase64,
            dateStr: now.toLocaleDateString('hi-IN'),
            timeStr: now.toLocaleTimeString('hi-IN', { hour: '2-digit', minute: '2-digit' })
        };
        savedEntries.unshift(newEntry);
        localStorage.setItem('athar_notebook_entries', JSON.stringify(savedEntries));
        
        document.getElementById('noteInput').value = '';
        removeUploadedImage();
        renderHistoryFeed();
        updateDashboardTotals();
    }

    function deleteSingleEntry(id) {
        savedEntries = savedEntries.filter(e => e.id !== id);
        localStorage.setItem('athar_notebook_entries', JSON.stringify(savedEntries));
        renderHistoryFeed();
        updateDashboardTotals();
    }

    function renderHistoryFeed() {
        let container = document.getElementById('savedEntriesList');
        if(!container) return;
        container.innerHTML = '';

        let filtered = savedEntries.filter(e => {
            if(currentHistoryFilter === 'income') return e.type === 'income';
            if(currentHistoryFilter === 'expense') return e.type === 'expense';
            return true;
        });

        if(filtered.length === 0) {
            container.innerHTML = `<p class="text-center text-xs text-gray-400 py-4">Koi pravisti uplabdh nahi hai.</p>`;
            return;
        }

        filtered.forEach(entry => {
            let isInc = entry.type === 'income';
            let card = document.createElement('div');
            card.className = `p-3.5 rounded-2xl border ${isInc ? 'bg-emerald-50/40 border-emerald-200/60' : 'bg-rose-50/40 border-rose-200/60'} custom-box-wrapper transition-all flex items-center justify-between gap-3`;
            
            let photoHTML = entry.photo ? `<img src="${entry.photo}" onclick="openPhotoZoom('${entry.photo}')" class="w-12 h-12 object-cover rounded-xl border-2 border-indigo-500 shadow-md cursor-pointer hover:scale-105 transition" title="Bada karne ke liye click karein">` : '';

            card.innerHTML = `
                <div class="space-y-1 flex-1">
                    <div class="flex items-center gap-2">
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${isInc ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">
                            ${isInc ? 'Kamai (+)' : 'Kharcha (-)'}
                        </span>
                        <span class="text-[10px] text-gray-400">${entry.dateStr || ''} ${entry.timeStr || ''}</span>
                    </div>
                    <p class="text-xs font-medium text-gray-800 whitespace-pre-wrap">${entry.note || ''}</p>
                    ${photoHTML}
                </div>
                <div class="text-right flex flex-col items-end gap-1">
                    <span class="text-sm font-extrabold ${isInc ? 'text-emerald-700' : 'text-rose-700'}">${isInc ? '+' : '-'}₹${entry.amount}</span>
                    <button onclick="deleteSingleEntry(${entry.id})" class="text-gray-400 hover:text-rose-600 text-xs p-1"><i class="fa-solid fa-trash-can"></i></button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function updateDashboardTotals() {
        // Dashboard sums placeholder if needed
    }

    // Zoom Modal Functions
    function openPhotoZoom(imgSrc) {
        let modal = document.getElementById('photoZoomModal');
        let modalImg = document.getElementById('zoomedImagePreview');
        if(modal && modalImg) {
            modalImg.src = imgSrc;
            modal.classList.remove('hidden');
        }
    }

    function closePhotoZoom() {
        let modal = document.getElementById('photoZoomModal');
        if(modal) modal.classList.add('hidden');
    }

    function saveCustomAppTitle() {
        let titleText = document.getElementById('editableAppTitle').innerText;
        localStorage.setItem('athar_custom_app_title', titleText);
    }

    window.onload = function() {
        let loadedEntries = localStorage.getItem('athar_notebook_entries');
        if(loadedEntries) savedEntries = JSON.parse(loadedEntries);
        
        let loadedRates = localStorage.getItem('athar_custom_rates');
        if(loadedRates) customRates = JSON.parse(loadedRates);

        renderHistoryFeed();
    };
</script>
</body>
</html>
