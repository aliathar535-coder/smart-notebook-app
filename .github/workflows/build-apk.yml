name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK (Android 15 / API 35)
        uses: android-actions/setup-android@v4
        with:
          api-level: 35
          build-tools: 35.0.0

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project & Build for Android 15
        run: |
          cordova create myApp com.gadipro.app gadipro
          cd myApp
          cordova platform add android@13.0.0
          cp ../index.html www/index.html
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gadipro-Android15-APK
          path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk

